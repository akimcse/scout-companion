# Version and release, on merge.
#
# Triggered by a push to main rather than by the pull_request event, and that is
# not a stylistic choice: pull requests here come from forks, and a workflow run
# for a fork's pull_request gets a read-only token. It could not push a version
# bump. A push to main runs in this repository's own context with a token that
# can write.
#
# The branch prefix decides the bump - feat/ moves the minor, everything else
# moves the patch - because that convention is already how intent is expressed
# here, across every merge so far. major is never automated: it claims that
# something people rely on has changed shape, and no branch name can establish
# that.
name: Release on merge

on:
  push:
    branches: [main]

# Two merges in quick succession would otherwise race to push the version
# commit. Queue them rather than cancelling: every merge deserves its release.
concurrency:
  group: release-on-merge
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    # The bump commit is itself a push to main. GitHub honours [skip ci] in a
    # commit message, and this repeats the condition so the loop cannot come
    # back if that behaviour ever changes.
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # tags, so a release can be created

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Work out the next version
        id: bump
        shell: pwsh
        env:
          # For the gh lookup below. Only ever read from, and the value it
          # returns is treated as data.
          GH_TOKEN: ${{ github.token }}
        run: |
          # Read the message out of the checked-out repository rather than
          # interpolating an Actions expression into this script. Pull requests
          # here come from forks, so the branch name and title are untrusted
          # input, and pasting untrusted text into a shell script running with
          # contents:write is a script-injection hole. git gives the same string
          # with no such path.
          #
          # (The comment says "an Actions expression" rather than writing one,
          # because an empty one written literally is a syntax error - GitHub
          # evaluates the run block's text before pwsh ever sees it, so a
          # PowerShell comment is no shelter. That is what broke the first run.)
          $subject = git log -1 --pretty=%s

          # A squash merge keeps the pull request number and drops the branch
          # name, so the prefix that decides the bump has to be looked up. This
          # is done here rather than in Bump-Version.ps1 so that file stays a
          # pure function over strings, and stays testable without a network.
          #
          # The branch arrives as data in a variable, never spliced into the
          # text of this script - same reasoning as the subject above.
          $branch = ''
          if ($subject -notmatch '^Merge pull request #\d+ from ' -and
              $subject -match '\(#(\d+)\)\s*$') {
              $pr = $matches[1]
              try {
                  $branch = (gh pr view $pr --json headRefName --jq .headRefName) 2>$null
                  Write-Host "  squash merge of #$pr, from branch '$branch'"
              } catch {
                  # Falling through with no branch means Bump-Version treats it
                  # as an unprefixed one and releases a patch, which is the
                  # conservative answer rather than releasing nothing.
                  Write-Host "  squash merge of #$pr, branch lookup failed - patch"
              }
          }
          ./Bump-Version.ps1 -Subject $subject -Branch $branch

          # Capture the body now, while HEAD is still the merge commit. The
          # publish step runs after the version has been committed and rebased,
          # so by then HEAD is the bot's own commit and its body is empty -
          # which is exactly how v0.8.3 came out with no notes. A file also
          # keeps this text out of step outputs, and so out of any script.
          git log -1 --pretty=%b | Out-File notes-body.md -Encoding utf8

      - name: Run the tests
        if: steps.bump.outputs.bumped == 'true'
        shell: pwsh
        run: |
          $fail = 0
          foreach ($t in 'Test-SessionMatch.ps1', 'Test-TitleLearning.ps1', 'Test-VoiceControl.ps1') {
            Write-Host "== $t"
            powershell -NoProfile -File ".\$t"
            if ($LASTEXITCODE -ne 0) { $fail++ }
          }
          # These build real windows, so they need -STA and somewhere to put a
          # window. If a hosted runner cannot do that, they say so and this
          # fails loudly rather than releasing untested.
          foreach ($t in 'Test-ButtonSearch.ps1', 'Test-SettingsUi.ps1', 'Test-MiniMode.ps1') {
            Write-Host "== $t"
            powershell -NoProfile -STA -File ".\$t"
            if ($LASTEXITCODE -ne 0) { $fail++ }
          }
          if ($fail) { throw "$fail test suite(s) failed - not releasing" }

      - name: Commit the version
        if: steps.bump.outputs.bumped == 'true'
        shell: pwsh
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add scout-companion.ps1
          $prev = '${{ steps.bump.outputs.previous }}'
          $next = '${{ steps.bump.outputs.version }}'
          git commit -m "$prev -> $next [skip ci]"
          # Another merge may have landed while the tests ran.
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Build the zip
        if: steps.bump.outputs.bumped == 'true'
        shell: pwsh
        run: ./Build-Release.ps1

      - name: Publish the release
        if: steps.bump.outputs.bumped == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = '${{ steps.bump.outputs.version }}'
          $prev = '${{ steps.bump.outputs.previous }}'
          $zip = ".\dist\ScoutCompanion-$v.zip"
          if (-not (Test-Path $zip)) { throw "no zip at $zip" }

          # The notes are the merge commit's body, which is the prose written
          # when the work was done. Anything better has to be written by hand,
          # and notes nobody edits beat notes nobody writes.
          #
          # Read from the file captured before the version was committed: by now
          # HEAD is the bot's commit, whose body is empty. Reading it from a
          # file rather than an Actions expression also keeps text a fork
          # controls out of this script.
          $body = if (Test-Path notes-body.md) { (Get-Content notes-body.md -Raw).Trim() } else { '' }
          $install = 'irm https://raw.githubusercontent.com/${{ github.repository }}/main/web-install.ps1 | iex'
          $fence = '```'
          $notes = @"
          $body

          ---

          $prev -> $v. Installed copies on 0.4.0 or later are offered this in the tray.

          ${fence}powershell
          $install
          ${fence}
          "@
          $notes | Set-Content notes.md -Encoding UTF8

          # Tag the commit carrying this version, not whatever main is by the
          # time this runs - a release must never ship contents newer than its
          # own tag.
          $sha = git rev-parse HEAD
          gh release create "v$v" $zip --title "v$v" --notes-file notes.md --target $sha
